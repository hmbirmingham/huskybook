services:
  - name: huskybook
    type: web
    runtime: node
    plan: free
    region: virginia
    # --include=dev is load-bearing, not optional: NODE_ENV=production is
    # set below for the whole service, and npm install skips
    # devDependencies whenever NODE_ENV=production is already in the
    # environment, which it is here, since Render applies a service's env
    # vars during the build step too, not just at runtime. vite,
    # @vitejs/plugin-react, and tailwindcss are all devDependencies of
    # client/, so without this flag the build step fails with
    # "vite: not found", confirmed by reproducing the exact failure
    # locally (a plain `NODE_ENV=production npm install` really does
    # install ~80 fewer packages and omit vite) before writing this fix.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below has no committed value. Render prompts for each
      # of these once, in the dashboard, when the Blueprint is first
      # applied. See .env.example for what each one is and where it comes
      # from; never put real values in this file.
      - key: RESEND_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
